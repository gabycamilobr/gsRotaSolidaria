spring:
  application:
    name: rota-solidaria-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rotasolidaria}
    username: ${DB_USER:rota}
    password: ${DB_PASSWORD:rota}
    hikari:
      maximum-pool-size: ${DB_POOL:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
  forward-headers-strategy: framework

app:
  fuso: America/Sao_Paulo
  reserva:
    # tempo de validade de uma reserva, em minutos (perfil "demo": 1 minuto)
    minutos: 45
  matching:
    raio-metros: 2000
  agendador:
    # intervalo da verificação de reservas vencidas e lotes expirados
    intervalo-ms: 15000
  jwt:
    segredo: ${JWT_SECRET:dev-segredo-local-rota-solidaria-troque-em-producao-0123456789}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:12}
  cors:
    origens: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  firebase:
    # caminho do JSON da conta de serviço do Firebase OU o JSON em Base64. Vazio = push desligado (aviso só dentro do app)
    credenciais: ${FIREBASE_CREDENTIALS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
