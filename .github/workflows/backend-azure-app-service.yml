# Testa a API (JUnit 5 + Mockito e testes contra PostGIS) e publica no Azure App Service.
# Secrets/variáveis necessários no repositório (Settings → Secrets and variables → Actions):
#   secrets.AZURE_WEBAPP_PUBLISH_PROFILE  – perfil de publicação baixado do App Service
#   vars.AZURE_WEBAPP_NAME                – nome do App Service (ex.: api-rota-solidaria)
name: API → Azure App Service

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-azure-app-service.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      # Banco descartável só para os testes do CI (não é infraestrutura do produto)
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rotasolidaria_test
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: rota
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rota -d rotasolidaria_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes e empacotamento
        env:
          ROTA_TEST_DB_URL: jdbc:postgresql://localhost:5432/rotasolidaria_test
          ROTA_TEST_DB_USER: rota
          ROTA_TEST_DB_PASSWORD: rota
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: backend/target/rota-solidaria-api.jar
          retention-days: 7

  deploy:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-jar
      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: rota-solidaria-api.jar
