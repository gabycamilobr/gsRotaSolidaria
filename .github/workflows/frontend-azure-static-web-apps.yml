# Gera o PWA e publica no Azure Static Web Apps.
# Secrets/variáveis necessários no repositório (Settings → Secrets and variables → Actions):
#   secrets.AZURE_STATIC_WEB_APPS_API_TOKEN – token de implantação do Static Web App
#   vars.VITE_API_URL                       – URL da API (ex.: https://api-rota-solidaria.azurewebsites.net)
#   vars.VITE_FIREBASE_*                    – opcionais (push). A configuração web do Firebase não é segredo.
name: PWA → Azure Static Web Apps

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-azure-static-web-apps.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build
      - name: Conferir bundle inicial (≤ 300 KB gzip)
        run: npm run tamanho
      - name: Publicar no Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
